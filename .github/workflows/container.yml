name: Container

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build application
        run: bun run build

      - name: Build image
        run: docker build --tag ed-badge-bypass:test .

      - name: Start hardened container
        run: |
          docker run --detach \
            --name ed-badge-bypass \
            --publish 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            ed-badge-bypass:test

      - name: Verify Nginx and representative routes
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          docker exec ed-badge-bypass nginx -t
          curl --fail --silent http://127.0.0.1:18080/ >/dev/null
          curl --fail --silent http://127.0.0.1:18080/site.webmanifest >/dev/null
          curl --fail --silent http://127.0.0.1:18080/favicon.svg >/dev/null
          curl --fail --silent http://127.0.0.1:18080/client-route >/dev/null

      - name: Show logs on failure
        if: failure()
        run: docker logs ed-badge-bypass

      - name: Stop container
        if: always()
        run: docker rm --force ed-badge-bypass || true
