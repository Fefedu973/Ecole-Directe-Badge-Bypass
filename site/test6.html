<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with QCM</title>
</head>

<body>
    <div>
        <input type="text" id="identifiant" placeholder="Identifiant">
        <input type="password" id="motdepasse" placeholder="Mot de passe">
        <button onclick="login()">Login</button>
    </div>
    <div id="qcm-container" style="display:none;">
        <p id="qcm-question"></p>
        <div id="qcm-options"></div>
        <button onclick="submitQCM()">Submit QCM</button>
    </div>
    <script>
        var token;

        function login() {
            const identifiant = document.getElementById("identifiant").value;
            const motdepasse = document.getElementById("motdepasse").value;
            console.log(identifiant);
            console.log(motdepasse);

            function sendPostRequest(url, data, callback) {
                const request = new XMLHttpRequest();
                request.open('POST', url, true);
                request.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded; charset=UTF-8');
                request.onreadystatechange = function () {
                    if (this.readyState === 4 && this.status === 200) {
                        callback(JSON.parse(this.responseText));
                    }
                };
                request.send(data);
            }

            function sendPostRequestQCM(url, data, token, callback) {
                const request = new XMLHttpRequest();
                request.open('POST', url, true);
                request.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded; charset=UTF-8');
                request.setRequestHeader('x-token', token);
                request.onreadystatechange = function () {
                    if (this.readyState === 4 && this.status === 200) {
                        callback(JSON.parse(this.responseText));
                    }
                };
                request.send(data);
            }

            const data = `data={"identifiant": "${identifiant}", "motdepasse": "${motdepasse}", "isRelogin": false, "uuid": ""}`;

            sendPostRequest('https://api.ecoledirecte.com/v3/login.awp', data, function (response) {
                if (response.code === 200) {
                    console.log("Connexion réussie:", response);
                } else if (response.code === 250) {
                    console.log("Double authentification requise");
                    token = response.token;

                    const emptydata = `data={}`;

                    sendPostRequestQCM('https://api.ecoledirecte.com/v3/connexion/doubleauth.awp?verbe=get', emptydata, token, function (qcmResponse) {
                        console.log("QCM reçu:", qcmResponse);

                        const question = atob(qcmResponse.data.question);
                        const propositions = qcmResponse.data.propositions.map(p => atob(p));
                        console.log("Question:", question);
                        console.log("Propositions:", propositions);

                        // Afficher le QCM dans le DOM
                        document.getElementById("qcm-question").innerText = question;
                        const optionsContainer = document.getElementById("qcm-options");
                        optionsContainer.innerHTML = '';
                        propositions.forEach((prop, index) => {
                            const option = document.createElement('div');
                            option.innerHTML = `
                                <input type="radio" name="qcm-option" id="option${index}" value="${qcmResponse.data.propositions[index]}">
                                <label for="option${index}">${prop}</label>
                            `;
                            optionsContainer.appendChild(option);
                        });

                        document.getElementById("qcm-container").style.display = 'block';
                    });
                } else {
                    console.log("Erreur de connexion:", response);
                }
            });
        }

        function submitQCM() {
            const selectedOption = document.querySelector('input[name="qcm-option"]:checked');
            if (selectedOption) {
                const choix = selectedOption.value;

                function sendPostRequest(url, data, token, callback) {
                    const request = new XMLHttpRequest();
                    request.open('POST', url, true);
                    request.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded; charset=UTF-8');
                    request.setRequestHeader('x-token', token);
                    request.onreadystatechange = function () {
                        if (this.readyState === 4 && this.status === 200) {
                            callback(JSON.parse(this.responseText));
                        }
                    };
                    request.send(data);
                }

                function sendPostRequest2(url, data, callback) {
                    const request = new XMLHttpRequest();
                    request.open('POST', url, true);
                    request.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded; charset=UTF-8');
                    request.onreadystatechange = function () {
                        if (this.readyState === 4 && this.status === 200) {
                            callback(JSON.parse(this.responseText));
                        }
                    };
                    request.send(data);
                }

                const identifiant = document.getElementById("identifiant").value;
                const motdepasse = document.getElementById("motdepasse").value;

                const qcmData = `data={"choix": "${choix}"}`;

                sendPostRequest('https://api.ecoledirecte.com/v3/connexion/doubleauth.awp?verbe=post', qcmData, token, function (finalResponse) {
                    if (finalResponse.code === 200) {
                        const cn = finalResponse.data.cn;
                        const cv = finalResponse.data.cv;
                        console.log("Réponse QCM réussie:", finalResponse);

                        const loginData = `data={"identifiant": "${identifiant}", "motdepasse": "${motdepasse}", "isRelogin": false, "uuid": "", "fa": [{"cn": "${cn}", "cv": "${cv}"}]}`;

                        sendPostRequest2('https://api.ecoledirecte.com/v3/login.awp', loginData, function (finalLoginResponse) {
                            if (finalLoginResponse.code === 200) {
                                console.log("Connexion finale réussie:", finalLoginResponse);
                                //récupérer la photo
                                const photourl = finalLoginResponse.data.accounts[0].profile.photo

                                const url = "https://api.ecole-directe.plus/proxy?url=https:" + photourl;

                                //créer une image
                                const img = document.createElement('img');
                                img.src = url;
                                document.body.appendChild(img);

                                //ajouter deux inputs de type date


                            } else {
                                console.log("Erreur de connexion finale:", finalLoginResponse);
                            }
                        });
                    } else {
                        console.log("Erreur de réponse au QCM:", finalResponse);
                    }
                });
            } else {
                alert("Veuillez sélectionner une option.");
            }
        }
    </script>
</body>


</html>
